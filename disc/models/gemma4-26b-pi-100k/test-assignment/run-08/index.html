<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DISC тест</title>
    <style>
        :root {
            --primary-color: #268AC5;
            --bg-color: #f4f7f9;
            --card-bg: #ffffff;
            --text-color: #333;
            --text-muted: #666;
            --border-color: #ddd;
            --accent-color: #e74c3c;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }

        #app {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            padding: 30px;
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 30px;
        }

        .progress-container {
            width: 100%;
            height: 10px;
            background-color: #eee;
            border-radius: 5px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background-color: var(--primary-color);
            width: 0%;
            transition: width 0.3s ease;
        }

        .step {
            display: none;
        }

        .step.active {
            display: block;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
        }

        .card-title {
            font-weight: bold;
            text-align: center;
            margin-bottom: 10px;
            font-size: 0.9em;
            color: var(--text-muted);
        }

        .card-foot {
            font-weight: bold;
            text-align: center;
            margin-top: 10px;
            font-size: 0.9em;
            color: var(--text-muted);
        }

        .sortable-list {
            list-style: none;
            padding: 0;
            margin: 0;
            min-height: 150px;
        }

        .sortable-item {
            background: #fff;
            border: 1px solid #eee;
            margin-bottom: 8px;
            padding: 10px;
            border-radius: 4px;
            cursor: grab;
            user-select: none;
            text-align: center;
            font-size: 0.95em;
            transition: transform 0.2s, background-color 0.2s;
        }

        .sortable-item:active {
            cursor: grabbing;
        }

        .sortable-item.dragging {
            opacity: 0.5;
            transform: scale(0.95);
            background-color: #f0f0f0;
        }

        .sortable-item.over {
            border-top: 2px solid var(--primary-color);
        }

        .actions {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        .btn {
            padding: 10px 25px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            transition: opacity 0.2s;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-ghost {
            background-color: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .results {
            display: none;
        }

        .results.active {
            display: block;
        }

        .result-item {
            margin-bottom: 20px;
        }

        .result-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .result-bar-bg {
            width: 100%;
            height: 20px;
            background-color: #eee;
            border-radius: 10px;
            overflow: hidden;
        }

        .result-bar-fill {
            height: 100%;
            background-color: var(--primary-color);
            width: 0%;
            transition: width 0.5s ease-out;
        }

        .result-desc {
            margin-top: 30px;
            padding: 20px;
            background: #f9f9f9;
            border-radius: 8px;
            line-height: 1.6;
        }

        @media (max-width: 600px) {
            .grid {
                grid-template-columns: 1fr;
            }
            body {
                padding: 10px;
            }
            #app {
                padding: 15px;
            }
        }
    </style>
</head>

            const title = document.createElement('div');

            title.textContent = cardData.title;
            card.appendChild(title);

            const list = document.createElement('ul');
            list.className = 'sortable-list';
            list.dataset.cardIndex = cardIndex;

            cardData.items.forEach((itemData, itemIndex) => {
                const li = document.createElement('li');
                li.className = 'sortable-item';
                li.textContent = itemData.text;
                li.dataset.type = itemData.type;
                li.draggable = true;

    // Drag and drop logic
    let draggedItem = null;

    function initDragAndDrop() {
        const lists = document.querySelectorAll('.sortable-list');
        lists.forEach(list => {
            list.addEventListener('dragstart', handleDragStart);
            list.addEventListener('dragover', handleDragOver);
            list.addEventListener('drop', handleDrop);
            list.addEventListener('dragend', handleDragEnd);
        });
    }

    function handleDragStart(e) {
        draggedItem = this.querySelector('.sortable-item.dragging') || e.target.closest('.sortable-item');
        if (!draggedItem) return;

        draggedItem.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
        // For Firefox compatibility
        e.dataTransfer.setData('text/plain', ''); 
    }

    function handleDragOver(e) {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        
        const target = e.target.closest('.sortable-item');
        if (target && target !== draggedItem) {
            const list = target.parentNode;
            const rect = target.getBoundingClientRect();
            const midpoint = rect.top + rect.height / 2;
            if (e.clientY < midpoint) {
                target.parentNode.insertBefore(draggedItem, target);
            } else {
                target.parentNode.insertBefore(draggedItem, target.nextSibling);
            }
        }
    }

    function handleDrop(e) {
        e.preventDefault();
    }

    function handleDragEnd() {
        if (draggedItem) {
            draggedItem.classList.remove('dragging');
            draggedItem = null;
        }
    }

    // Navigation

        // Update steps

            step.classList.toggle('active', idx === currentStep);
        });

            nextBtn.style.display = 'none';
            finishBtn.style.display = 'block';
        } else {
            nextBtn.style.display = 'block';
            finishBtn.style.display = 'none';
        }

        // Update progress
        const progress = ((currentStep) / totalSteps) * 100;
        progressBar.style.width = `${progress}%`;
    }

            items.forEach((item, index) => {
                // Rank 1 (index 0) gets 4 points
                // Rank 4 (index 3) gets 1 point
                const points = 4 - index;
                const type = item.dataset.type;
                scores[type] += points;
            });
        });

        showResults(scores);
    }
