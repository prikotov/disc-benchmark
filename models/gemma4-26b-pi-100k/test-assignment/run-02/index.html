<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Тест DISC</title>
    <style>
        :root {
            --primary-color: #268AC5;
            --bg-color: #f4f7f9;
            --text-color: #333;
            --card-bg: #ffffff;
            --border-color: #e0e0e0;
            --accent-color: #ff6b6b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Header & Intro */
        header {
            width: 100%;
            padding: 2rem 1rem;
            text-align: center;
            background: linear-gradient(135deg, #268AC5 0%, #1a5a85 100%);
            color: white;
            margin-bottom: 2rem;
        }

        h1 { margin: 0; font-size: 1.8rem; }
        p.subtitle { opacity: 0.9; margin-top: 0.5rem; }

        .container {
            width: 90%;
            max-width: 600px;
            margin-bottom: 3rem;
        }

        /* Wizard Styles */
        .wizard {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        /* Progress Bar */
        .progress-container {
            width: 100%;
            height: 8px;
            background: #eee;
            border-radius: 4px;
            margin-bottom: 2rem;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: var(--primary-color);
            width: 0%;
            transition: width 0.3s ease;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            overflow-x: auto;
            padding-bottom: 0.5rem;
        }

        .tab {
            padding: 0.5rem 1rem;
            background: #eee;
            border-radius: 20px;
            font-size: 0.8rem;
            white-space: nowrap;
            cursor: pointer;
        }

        .tab.active {
            background: var(--primary-color);
            color: white;
        }

        /* Step Panes */
        .pane { display: none; }
        .pane.active { display: block; }

        /* Quiz Cards */
        .question-group {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .disc-card {
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1rem;
            background: #fafafa;
        }

        .disc-card__title {
            font-weight: bold;
            margin-bottom: 1rem;
            color: #555;
            text-align: center;
        }

        .disc-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .disc-item {
            background: white;
            border: 1px solid var(--border-color);
            padding: 0.8rem 1rem;
            margin-bottom: 0.5rem;
            border-radius: 6px;
            cursor: grab;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: transform 0.1s, background-color 0.2s;
        }

        .disc-item:active { cursor: grabbing; }
        .disc-item.is-dragging { opacity: 0.5; border: 2px dashed var(--primary-color); }
        .disc-item.is-over { border-top: 3px solid var(--primary-color); }

        .disc-handle {
            color: #ccc;
            padding-right: 10px;
            user-select: none;
        }

        .disc-card__foot {
            font-size: 0.8rem;
            color: #888;
            text-align: center;
            margin-top: 1rem;
        }

        /* Buttons */
        .controls {
            display: flex;
            justify-content: space-between;
            margin-top: 2rem;
        }

        button {
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: opacity 0.2s;
        }

        button:disabled { opacity: 0.3; cursor: not-allowed; }

        .btn-prev { background: #eee; color: var(--text-color); }
        .btn-next, .btn-finish { background: var(--primary-color); color: white; }

        /* Results View */
        #result-view {
            display: none;
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
        }

        .result-score-container {
            display: flex;
            justify-content: space-around;
            margin: 2rem 0;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .score-box {
            padding: 1rem;
            border-radius: 8px;
            min-width: 80px;
        }

        .score-box.D { background: #ff6b6b; color: white; }
        .score-box.I { background: #ffcc33; color: white; }
        .score-box.S { background: #4caf50; color: white; }
        .score-box.C { background: #2196f3; color: white; }

        .score-val { font-size: 1.5rem; font-weight: bold; display: block; }
        .score-label { font-size: 0.9rem; }

        /* Utilities */
        .hidden { display: none !important; }

        @media (max-width: 600px) {
            .container { width: 95%; }
            h1 { font-size: 1.4rem; }
        }
    </style>
</head>
<body>

</header>

<div class="container">
    <!-- Quiz Interface -->
    <div id="quiz-view" class="wizard">
        <div class="progress-container">
            <div id="progress-bar" class="progress-bar"></div>
        </div>

        <div class="tabs" id="tabs-container">
            <!-- Tabs generated via JS -->
        </div>

        <div id="panes-container">
            <!-- Panes generated via JS -->
        </div>

        <div class="controls">
            <button id="btn-prev" class="btn-prev">Назад</button>
            <button id="btn-next" class="btn-next">Далее</button>
            <button id="btn-finish" class="btn-finish hidden">Показать результат</button>
        </div>
    </div>

    <!-- Results Interface -->
    <div id="result-view">
        <h2>Ваш профиль DISC</h2>
        <div class="result-score-container" id="score-display">
            <!-- Scores generated via JS -->
        </div>
        <p id="result-text"></p>
        <button onclick="location.reload()" style="background: var(--primary-color); color: white; margin-top: 1rem;">Пройти еще раз</button>
    </div>
</div>

                ]}
            ]
        },
        {
            cards: [
                { title: "Я наиболее", items: [
                    { text: "Обаятельный", type: "i" },
                    { text: "Позитивный", type: "d" },
                    { text: "Снисходительный", type: "s" },
                    { text: "Требовательный", type: "c" }
                ]},
                { title: "Я наименее", items: [
                    { text: "Коммуникабельный", type: "i" },
                    { text: "Смелый", type: "d" },
                    { text: "Перфекционист", type: "c" },
                    { text: "Сдержанный", type: "s" }
                ]}
            ]
        }
    ];

    // State management
    let currentStep = 0;
    const totalSteps = QUESTIONS.length;

    // DOM elements
    const tabsContainer = document.getElementById('tabs-container');
    const panesContainer = document.getElementById('panes-container');
    const progressBar = document.getElementById('progress-bar');
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');
    const btnFinish = document.getElementById('btn-finish');
    const quizView = document.getElementById('quiz-view');
    const resultView = document.getElementById('result-view');
    const scoreDisplay = document.getElementById('score-display');

    // Initialize UI
    function init() {
        QUESTIONS.forEach((_, idx) => {
            // Create Tab
            const tab = document.createElement('div');
            tab.className = `tab ${idx === 0 ? 'active' : ''}`;
            tab.textContent = `${idx + 1}`;
            tab.dataset.step = idx;
            tab.onclick = () => goToStep(idx);
            tabsContainer.appendChild(tab);

            // Create Pane
            const pane = document.createElement('div');
            pane.className = `pane ${idx === 0 ? 'active' : ''}`;
            pane.dataset.step = idx;
            
            const group = document.createElement('div');
            group.className = 'question-group';
            
            QUESTIONS[idx].cards.forEach((card, cardIdx) => {
                const cardEl = document.createElement('div');
                cardEl.className = 'disc-card';
                
                const title = document.createElement('div');
                title.className = 'disc-card__title';
                title.textContent = card.title;
                cardEl.appendChild(title);

                const list = document.createElement('ul');
                list.className = 'disc-list';
                list.id = `list-${idx}-${cardIdx}`;

                card.items.forEach(item => {
                    const li = document.createElement('li');
                    li.className = 'disc-item';
                    li.draggable = true;
                    li.dataset.type = item.type;
                    li.innerHTML = `<span class="disc-handle">⠿</span> ${item.text}`;
                    
                    // Drag events
                    li.addEventListener('dragstart', handleDragStart);
                    li.addEventListener('dragover', handleDragOver);
                    li.addEventListener('dragleave', handleDragLeave);
                    li.addEventListener('drop', handleDrop);
                    li.addEventListener('dragend', handleDragEnd);
                    
                    list.appendChild(li);
                });

                cardEl.appendChild(list);

                const foot = document.createElement('div');
                foot.className = 'disc-card__foot';
                foot.textContent = card.title.includes("наименее") ? "Я наименее" : "Я наиболее";
                cardEl.appendChild(foot);

                group.appendChild(cardEl);
            });

            pane.appendChild(group);
            panesContainer.appendChild(pane);
        });

        updateUI();
        setupSortable();
    }

    // Navigation
    function goToStep(step) {
        currentStep = step;
        updateUI();
    }

    function updateUI() {
        // Tabs
        document.querySelectorAll('.tab').forEach(t => {
            t.classList.toggle('active', parseInt(t.dataset.step) === currentStep);
        });
        // Panes
        document.querySelectorAll('.pane').forEach(p => {
            p.classList.toggle('active', parseInt(p.dataset.step) === currentStep);
        });

        // Buttons
        btnPrev.disabled = (currentStep === 0);
        if (currentStep === totalSteps - 1) {
            btnNext.classList.add('hidden');
            btnFinish.classList.remove('hidden');
        } else {
            btnNext.classList.remove('hidden');
            btnFinish.classList.add('hidden');
        }

        // Progress
        const percent = ((currentStep + 1) / totalSteps) * 100;
        progressBar.style.width = `${percent}%`;
    }

    btnNext.onclick = () => {
        if (currentStep < totalSteps - 1) {
            currentStep++;
            updateUI();
        }
    };

    btnPrev.onclick = () => {
        if (currentStep > 0) {
            currentStep--;
            updateUI();
        }
    };

    btnFinish.onclick = calculateResults;

    // Drag and Drop Logic
    let draggedItem = null;

    function handleDragStart(e) {
        draggedItem = this;
        this.classList.add('is-dragging');
        e.dataTransfer.effectAllowed = 'move';
    }

    function handleDragOver(e) {
        e.preventDefault();
        this.classList.add('is-over');
    }

    function handleDragLeave() {
        this.classList.remove('is-over');
    }

    function handleDrop(e) {
        e.preventDefault();
        this.classList.remove('is-over');
        if (this === draggedItem) return;

        const parent = this.parentNode;
        const allItems = Array.from(parent.children);
        const targetIdx = allItems.indexOf(this);
        const draggedIdx = allItems.indexOf(draggedItem);

        if (draggedIdx < targetIdx) {
            this.after(draggedItem);
        } else {
            this.before(draggedItem);
        }
    }

    function handleDragEnd() {
        this.classList.remove('is-dragging');
        draggedItem = null;
        document.querySelectorAll('.disc-item').forEach(item => item.classList.remove('is-over'));
    }

        // Basic prevention of browser default behavior for drag
        // The logic above handles simple swap/insert
    }

    // Score Calculation Logic
    // maj = pos 0, min = pos 3
    function calculateResults() {
        const scores = { d: 0, i: 0, s: 0, c: 0 };
        const majCount = { d: 0, i: 0, s: 0, c: 0 };
        const minCount = { d: 0, i: 0, s: 0, c: 0 };

        // Iterate through all questions and all cards
        QUESTIONS.forEach((_, qIdx) => {
            QUESTIONS[qIdx].cards.forEach((_, cIdx) => {
                const list = document.getElementById(`list-${qIdx}-${cIdx}`);
                if (!list) return;
                const items = Array.from(list.children);
                
                items.forEach((item, pos) => {
                    const type = item.dataset.type;
                    if (pos === 0) majCount[type]++;
                    if (pos === 3) minCount[type]++;
                });
            });
        });

        // Apply scoring formula (difference between major and minor)
        scores.d = majCount.d - minCount.d;
        scores.i = majCount.i - minCount.i;
        scores.s = majCount.s - minCount.s;
        scores.c = majCount.c - minCount.c;

        showResults(scores);
    }

    function showResults(scores) {
        quizView.classList.add('hidden');
        resultView.style.display = 'block';

        // Map scores to types for display
        const mapping = [
            { id: 'D', label: 'Доминирование', val: scores.d },
            { id: 'I', label: 'Влияние', val: scores.i },
            { id: 'S', label: 'Стабильность', val: scores.s },
            { id: 'C', label: 'Соответствие', val: scores.c }
        ];

        scoreDisplay.innerHTML = '';
        mapping.forEach(m => {
            const box = document.createElement('div');
            box.className = `score-box ${m.id}`;
            box.innerHTML = `
                <span class="score-val">${m.val}</span>
                <span class="score-label">${m.label}</span>
            `;
            scoreDisplay.appendChild(box);
        });

        // Simple descriptive text based on highest score
        const maxScore = Math.max(...Object.values(scores));
        let highestType = '';
        if (scores.d === maxScore) highestType = 'D';
        else if (scores.i === maxScore) highestType = 'I';
        else if (scores.s === maxScore) highestType = 'S';
        else highestType = 'C';

        const desc = {
            D: "Ваш ведущий тип — Доминирование. Вы ориентированы на результат, решительны и любите вызовы.",
            I: "Ваш ведущий тип — Влияние. Вы общительны, оптимистичны и умеете вдохновлять людей.",
            S: "Ваш ведущий тип — Стабильность. Вы надежны, предсказуемы и умеете работать в команде.",
            C: "Ваш ведущий тип — Соответствие. Вы внимательны к деталям, системны и стремитесь к качеству."
        };

        document.getElementById('result-text').textContent = desc[highestType];
        window.scrollTo(0, 0);
    }

    // Start
    init();
</script>
