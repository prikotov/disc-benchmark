<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DISC Тест — Копия</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
            --d-color: #ef4444;
            --i-color: #f59e0b;
            --s-color: #10b981;
            --c-color: #3b82f6;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #app {
            width: 100%;
            max-width: 800px;
            padding: 20px;
        }

        .container {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            padding: 30px;
            overflow: hidden;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 1.5rem;
        }

        /* Progress Bar */
        .progress-container {
            width: 100%;
            height: 8px;
            background: var(--border-color);
            border-radius: 4px;
            margin-bottom: 30px;
        }

        .progress-bar {
            height: 100%;
            background: var(--primary-color);
            border-radius: 4px;
            width: 0%;
            transition: width 0.3s ease;
        }

        /* Steps */
        .step {
            display: none;
        }

        .step.active {
            display: block;
        }

        .question-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
        }

        .card-title {
            font-weight: 600;
            margin-bottom: 10px;
            font-size: 0.9rem;
            color: #64748b;
        }

        .card-foot {
            font-weight: 600;
            margin-top: 10px;
            font-size: 0.9rem;
            color: #64748b;
            text-align: right;
        }

        /* Sortable List */
        .sortable-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .sortable-item {
            background: #f1f5f9;
            margin: 5px 0;
            padding: 10px;
            border-radius: 6px;
            cursor: grab;
            font-size: 0.9rem;
            border: 1px solid transparent;
            user-select: none;
        }

        .sortable-item:active {
            cursor: grabbing;
        }

        .sortable-item.dragging {
            opacity: 0.5;
            border: 1px dashed var(--primary-color);
        }

        .sortable-item.over {
            border-top: 2px solid var(--primary-color);
        }

        /* Navigation */
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        button {
            padding: 10px 24px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        .btn-prev {
            background: #e2e8f0;
            color: #475569;
        }

        .btn-prev:hover {
            background: #cbd5e1;
        }

        .btn-next, .btn-finish {
            background: var(--primary-color);
            color: white;
        }

        .btn-next:hover, .btn-finish:hover {
            background: #1d4ed8;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Results */
        .results-container {
            display: none;
        }

        .results-container.active {
            display: block;
        }

        .result-item {
            margin-bottom: 20px;
        }

        .result-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .result-bar-bg {
            height: 24px;
            background: #e2e8f0;
            border-radius: 12px;
            overflow: hidden;
        }

        .result-bar {
            height: 100%;
            width: 0%;
            transition: width 1s ease-out;
        }

        .d-bar { background-color: var(--d-color); }
        .i-bar { background-color: var(--i-color); }
        .s-bar { background-color: var(--s-color); }
        .c-bar { background-color: var(--c-color); }

        @media (max-width: 600px) {
            .question-grid {
                grid-template-columns: 1fr;
            }
            .container {
                padding: 15px;
            }
        }
    </style>
</head>
<body>

<div id="app">
    <div class="container">
        <div id="test-ui">
            <h1 id="test-title">Тест DISC</h1>
            <div class="progress-container">
                <div id="progress-bar" class="progress-bar"></div>
            </div>

            <div id="wizard">
                <!-- Steps will be injected here -->
            </div>

            <div class="nav-buttons">
                <button id="btn-prev" class="btn-prev" disabled>Назад</button>
                <button id="btn-next" class="btn-next">Далее</button>
                <button id="btn-finish" class="btn-finish" style="display: none;">Результат</button>
            </div>
        </div>

        <div id="result-ui" class="results-container">
            <h1>Ваш результат</h1>
            <div id="results-content">
                <!-- Results bars will be injected here -->
            </div>
            <button id="btn-restart" class="btn-prev" style="width: 100%; margin-top: 30px;">Пройти заново</button>
        </div>
    </div>
</div>

<script>
    // Data extracted from source
    const questionsData = [
      [[{"text":"Экспресcивный","type":"i"},{"text":"Покладистый","type":"c"},{"text":"Волевой","type":"d"},{"text":"Осторожный","type":"s"}],[{"text":"Пылкий","type":"d"},{"text":"Разговорчивый","type":"i"},{"text":"Добродушный","type":"s"},{"text":"Сдержанный","type":"c"}],[{"text":"Любитель приключений","type":"i"},{"text":"Энтузиаст","type":"c"},{"text":"Исполнитель инструкций","type":"d"},{"text":"Верный","type":"s"}]],
      [[{"text":"Настойчивый","type":"d"},{"text":"Осторожный","type":"c"},{"text":"Эмоциональный","type":"i"},{"text":"Удовлетворенный","type":"s"}],[{"text":"Довольный","type":"s"},{"text":"Нетерпеливый","type":"d"},{"text":"Убедительный","type":"i"},{"text":"Безропотный","type":"c"}],[{"text":"Смиренный","type":"c"},{"text":"Умеющий слушать","type":"s"},{"text":"Душа компании","type":"i"},{"text":"Волевой","type":"d"}]],
      [[{"text":"Правильный","type":"c"},{"text":"Первопроходец","type":"d"},{"text":"Спокойный","type":"s"},{"text":"Влиятельный","type":"i"}],[{"text":"Почтительный","type":"c"},{"text":"Контактный","type":"i"},{"text":"Агрессивный","type":"d"},{"text":"Мягкий","type":"s"}],[{"text":"Весельчак","type":"i"},{"text":"Покорный","type":"s"},{"text":"Тактичный","type":"c"},{"text":"Соперничающий","type":"d"}]],
      [[{"text":"Точный","type":"c"},{"text":"Доминирующий","type":"d"},{"text":"Охотный","type":"s"},{"text":"Притягательный","type":"i"}],[{"text":"Уравновешенный","type":"i"},{"text":"Уступчивый","type":"c"},{"text":"Идущий на риск","type":"d"},{"text":"Услужливый","type":"s"}],[{"text":"Осмотрительный","type":"c"},{"text":"Добрососедский","type":"s"},{"text":"Энергичный","type":"d"},{"text":"Убедительный","type":"i"}]],
      [[{"text":"Уравновешенный","type":"s"},{"text":"Мотивирующий","type":"i"},{"text":"Щепетильный","type":"c"},{"text":"Решительный","type":"d"}],[{"text":"Уверенный","type":"i"},{"text":"Готовый к сотрудничеству","type":"c"},{"text":"Беззаботный","type":"s"},{"text":"Аргументирующий","type":"d"}],[{"text":"Сдержанный","type":"s"},{"text":"Прямой","type":"d"},{"text":"Строгий","type":"c"},{"text":"Убедительный","type":"i"}]],
      [[{"text":"Застенчивый","type":"c"},{"text":"Требовательный","type":"d"},{"text":"Терпеливый","type":"s"},{"text":"Очаровательный","type":"i"}],[{"text":"Неугомонный","type":"d"},{"text":"Дисциплинированный","type":"c"},{"text":"Вдохновляющий","type":"i"},{"text":"Внимательный","type":"s"}],[{"text":"Обязательный","type":"s"},{"text":"Оживленный","type":"i"},{"text":"Решительный","type":"d"},{"text":"Точный","type":"c"}]],
      [[{"text":"Добросовестный","type":"c"},{"text":"Компанейский","type":"i"},{"text":"Добрый","type":"s"},{"text":"Уверенный в себе","type":"d"}],[{"text":"Дипломатичный","type":"c"},{"text":"Отважный","type":"d"},{"text":"Сочувствующий","type":"s"},{"text":"Оптимистичный","type":"i"}],[{"text":"Настойчивый","type":"d"},{"text":"Общительный","type":"i"},{"text":"Постоянный","type":"s"},{"text":"Организованный","type":"c"}]],
      [[{"text":"Соглашающийся","type":"c"},{"text":"Владеющий собой","type":"s"},{"text":"Шутливый","type":"d"},{"text":"Настойчивый","type":"i"}],[{"text":"Обаятельный","type":"i"},{"text":"Позитивный","type":"d"},{"text":"Снисходительный","type":"s"},{"text":"Требовательный","type":"c"}],[{"text":"Коммуникабельный","type":"i"},{"text":"Смелый","type":"d"},{"text":"Перфекционист","type":"c"},{"text":"Сдержанный","type":"s"}]]
    ];

    let currentStep = 0;
    const totalSteps = questionsData.length;

    const wizard = document.getElementById('wizard');
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');
    const btnFinish = document.getElementById('btn-finish');
    const progressBar = document.getElementById('progress-bar');
    const testUI = document.getElementById('test-ui');
    const resultUI = document.getElementById('result-ui');
    const resultsContent = document.getElementById('results-content');

    // Initialize Wizard
    function initWizard() {
        wizard.innerHTML = '';
        questionsData.forEach((paneData, stepIndex) => {
            const stepDiv = document.createElement('div');
            stepDiv.className = `step ${stepIndex === 0 ? 'active' : ''}`;
            stepDiv.dataset.step = stepIndex;

            const grid = document.createElement('div');
            grid.className = 'question-grid';

            paneData.forEach((cardData, cardIndex) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-title">Я наиболее</div>
                    <ul class="sortable-list" data-card-index="${stepIndex}-${cardIndex}">
                        ${cardData.map(item => `
                            <li class="sortable-item" draggable="true" data-type="${item.type}">${item.text}</li>
                        `).join('')}
                    </ul>
                    <div class="card-foot">Я наименее</div>
                `;
                grid.appendChild(card);
            });

            stepDiv.appendChild(grid);
            wizard.appendChild(stepDiv);
        });

        setupDragAndDrop();
    }

    function setupDragAndDrop() {
        const lists = document.querySelectorAll('.sortable-list');
        
        lists.forEach(list => {
            let draggingItem = null;

            list.addEventListener('dragstart', (e) => {
                draggingItem = e.target;
                e.target.classList.add('dragging');
            });

            list.addEventListener('dragend', (e) => {
                e.target.classList.remove('dragging');
                document.querySelectorAll('.sortable-item').forEach(i => i.classList.remove('over'));
            });

            list.addEventListener('dragover', (e) => {
                e.preventDefault();
                const target = e.target.closest('.sortable-item');
                if (target && target !== draggingItem) {
                    const rect = target.getBoundingClientRect();
                    const next = (e.clientY - rect.top) / (rect.bottom - rect.top) > 0.5;
                    list.insertBefore(draggingItem, next ? target.nextSibling : target);
                }
            });
        });
    }

    function updateUI() {
        document.querySelectorAll('.step').forEach((step, idx) => {
            step.classList.toggle('active', idx === currentStep);
        });

        btnPrev.disabled = currentStep === 0;
        
        if (currentStep === totalSteps - 1) {
            btnNext.style.display = 'none';
            btnFinish.style.display = 'block';
        } else {
            btnNext.style.display = 'block';
            btnFinish.style.display = 'none';
        }

        const progress = ((currentStep + 1) / totalSteps) * 100;
        progressBar.style.width = `${progress}%`;
    }

    function getResults() {
        // Collect all items in all lists
        const allLists = document.querySelectorAll('.sortable-list');
        const payload = [];

        allLists.forEach((ul, listIndex) => {
            const items = ul.querySelectorAll('.sortable-item');
            items.forEach((li, pos) => {
                payload.push({
                    listIndex: listIndex,
                    pos: pos,
                    type: li.dataset.type
                });
            });
        });

        // Score logic
        const maj = [];
        const min = [];

        payload.forEach(item => {
            if (item.pos === 0) maj.push(item.type);
            if (item.pos === 3) min.push(item.type);
        });

        const count = (arr, type) => arr.filter(t => t === type).length;

        return {
            d: count(maj, 'd') - count(min, 'd'),
            i: count(maj, 'i') - count(min, 'i'),
            s: count(maj, 's') - count(min, 's'),
            c: count(maj, 'c') - count(min, 'c')
        };
    }

    function showResults() {
        const scores = getResults();
        testUI.style.display = 'none';
        resultUI.classList.add('active');

        const types = [
            { id: 'd', label: 'Dominance (D)', color: 'var(--d-color)' },
            { id: 'i', label: 'Influence (I)', color: 'var(--i-color)' },
            { id: 's', label: 'Stability (S)', color: 'var(--s-color)' },
            { id: 'c', label: 'Compliance (C)', color: 'var(--c-color)' }
        ];

        resultsContent.innerHTML = '';
        
        // Find max for normalization if needed, but here we just show relative score
        // The score can be negative. Let's normalize to 0-100 range for visualization.
        // A typical score range is -4 to 4 (well, more depending on number of questions)
        // Let's say max possible is total questions (24). 
        // Let's just use the raw score and map it. 
        // Or simply, since it's for visualization, let's make it 0 to 100 based on a reasonable max.
        // Max score for one type is 24, min is -24.
        // Let's transform: (score + 24) / 48 * 100
        
        types.forEach(type => {
            const score = scores[type.id];
            const displayScore = Math.max(0, (score + 24) / 48 * 100); // very rough mapping
            
            // Actually, the raw results might be more meaningful if we show them differently.
            // Let's just show the actual score + normalized bar.
            // Since the requirement says "sees their scores", let's show the score value too.
            
            const val = score; // could be negative
            
            // For the bar, we'll use a simpler approach:
            // The bar will represent the value relative to a possible range.
            // BUT, many DISC implementations show the score on a scale.
            // Let's use a scale of -30 to 30 for the bar to keep it centered.
            // Actually, let's just use the score as is and show it.
            
            const barWidth = Math.max(0, (score + 24) / 48 * 100); 

            const item = document.createElement('div');
            item.className = 'result-item';
            item.innerHTML = `
                <div class="result-label">
                    <span>${type.label}</span>
                    <span>${val}</span>
                </div>
                <div class="result-bar-bg">
                    <div class="result-bar ${type.id}-bar" style="width: 0%"></div>
                </div>
            `;
            resultsContent.appendChild(item);
            
            // Animate bar
            setTimeout(() => {
                item.querySelector('.result-bar').style.width = `${barWidth}%`;
            }, 100);
        });
    }

    // Event Listeners
    btnPrev.addEventListener('click', () => {
        if (currentStep > 0) {
            currentStep--;
            updateUI();
        }
    });

    btnNext.addEventListener('click', () => {
        if (currentStep < totalSteps - 1) {
            currentStep++;
            updateUI();
        }
    });

    btnFinish.addEventListener('click', () => {
        showResults();
    });

    document.getElementById('btn-restart').addEventListener('click', () => {
        location.reload();
    });

    // Start
    initWizard();
    updateUI();

</script>

</body>
</html>
