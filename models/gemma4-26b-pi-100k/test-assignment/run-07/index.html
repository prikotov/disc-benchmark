<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DISC Тестирование</title>
    <style>
        :root {
            --primary-color: #268AC5;
            --primary-hover: #1e6e9b;
            --bg-color: #f4f7f9;
            --text-color: #333;
            --card-bg: #ffffff;
            --border-color: #e0e0e0;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            --font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: var(--font-family);
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #app {
            width: 100%;
            max-width: 1100px;
            padding: 20px;
        }

        .quiz-container {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: var(--shadow);
            padding: 30px;
        }

        .quiz-header { text-align: center; margin-bottom: 30px; }
        .quiz-header h1 { margin: 0 0 10px 0; font-size: 24px; }
        .quiz-header p { color: #666; margin: 0; }

        .tabs { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin-bottom: 30px; }
        .tab { padding: 6px 12px; border: none; background: #eee; border-radius: 20px; font-size: 12px; cursor: pointer; }
        .tab.active { background: var(--primary-color); color: white; }

        .quiz-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 30px; }

        .card { border: 1px solid var(--border-color); border-radius: 8px; display: flex; flex-direction: column; background: #fff; }
        .card__title { padding: 15px; text-align: center; font-weight: bold; background: #f9f9f9; border-bottom: 1px solid var(--border-color); border-radius: 8px 8px 0 0; }
        .card__foot { padding: 15px; text-align: center; font-weight: bold; font-size: 0.9em; color: #777; border-top: 1px solid var(--border-color); border-radius: 0 0 8px 8px; }

        .list { list-style: none; padding: 10px; margin: 0; min-height: 200px; }
        .item { padding: 12px 15px; margin-bottom: 8px; background: #fff; border: 1px solid #eee; border-radius: 6px; cursor: grab; user-select: none; }
        .item.dragging { opacity: 0.5; }
        .item.over { border-top: 3px solid var(--primary-color); }

        .quiz-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border-color); padding-top: 20px; }
        .btn { padding: 10px 25px; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; transition: background 0.3s; }
        .btn--primary { background: var(--primary-color); color: white; }
        .btn--primary:hover { background: var(--primary-hover); }
        .btn--primary:disabled { background: #ccc; cursor: not-allowed; }
        .btn--ghost { background: transparent; color: #666; }
        .btn--ghost:hover { background: #f0f0f0; }

        .progress-container { flex-grow: 1; height: 10px; background: #eee; margin: 0 30px; border-radius: 5px; overflow: hidden; }
        .progress-bar { height: 100%; background: var(--primary-color); width: 0%; transition: width 0.3s ease; }

        .results-container { background: white; padding: 40px; border-radius: 12px; box-shadow: var(--shadow); text-align: center; }
        .results-container h2 { margin-bottom: 30px; }
        .score-row { margin-bottom: 25px; text-align: left; }
        .score-info { display: flex; justify-content: space-between; margin-bottom: 8px; font-weight: bold; }
        .score-bar-bg { height: 20px; background: #eee; border-radius: 10px; overflow: hidden; }
        .score-bar-fill { height: 100%; background: var(--primary-color); width: 0%; transition: width 1s ease-out; }
        .desc-box { margin-top: 40px; padding: 20px; background: #f9f9f9; border-radius: 8px; text-align: left; line-height: 1.6; }

        @media (max-width: 768px) {
            .quiz-grid { grid-template-columns: 1fr; }
            .quiz-footer { flex-direction: column; gap: 20px; }
            .progress-container { width: 100%; margin: 10px 0; }
        }
    </style>
</head>
<body>

<div id="app"></div>

<script>
    const questions = [
        [{ text: "Экспресcивный", type: "i" }, { text: "Покладистый", type: "c" }, { text: "Волевой", type: "d" }, { text: "Осторожный", type: "s" }],
        [{ text: "Пылкий", type: "d" }, { text: "Разговорчивый", type: "i" }, { text: "Добродушный", type: "s" }, { text: "Сдержанный", type: "c" }],
        [{ text: "Любитель приключений", type: "i" }, { text: "Энтузиаст", type: "c" }, { text: "Исполнитель инструкций", type: "d" }, { text: "Верный", type: "s" }],
        [{ text: "Настойчивый", type: "d" }, { text: "Осторожный", type: "c" }, { text: "Эмоциональный", type: "i" }, { text: "Удовлетворенный", type: "s" }],
        [{ text: "Довольный", type: "s" }, { text: "Нетерпеливый", type: "d" }, { text: "Убедительный", type: "i" }, { text: "Безропотный", type: "c" }],
        [{ text: "Смиренный", type: "c" }, { text: "Умеющий слушать", type: "s" }, { text: "Душа компании", type: "i" }, { text: "Волевой", type: "d" }],
        [{ text: "Правильный", type: "c" }, { text: "Первопроходец", type: "d" }, { text: "Спокойный", type: "s" }, { text: "Влиятельный", type: "i" }],
        [{ text: "Почтительный", type: "c" }, { text: "Контактный", type: "i" }, { text: "Агрессивный", type: "d" }, { text: "Мягкий", type: "s" }],
        [{ text: "Весельчак", type: "i" }, { text: "Покорный", type: "s" }, { text: "Тактичный", type: "c" }, { text: "Соперничающий", type: "d" }],
        [{ text: "Точный", type: "c" }, { text: "Доминирующий", type: "d" }, { text: "Охотный", type: "s" }, { text: "Притягательный", type: "i" }],
        [{ text: "Уравновешенный", type: "i" }, { text: "Уступчивый", type: "c" }, { text: "Идущий на риск", type: "d" }, { text: "Услужливый", type: "s" }],
        [{ text: "Осмотрительный", type: "c" }, { text: "Добрососедский", type: "s" }, { text: "Энергичный", type: "d" }, { text: "Убедительный", type: "i" }],
        [{ text: "Уравновешенный", type: "s" }, { text: "Мотивирующий", type: "i" }, { text: "Щепетильный", type: "c" }, { text: "Решительный", type: "d" }],
        [{ text: "Уверенный", type: "i" }, { text: "Готовый к сотрудничеству", type: "c" }, { text: "Беззаботный", type: "s" }, { text: "Аргументирующий", type: "d" }],
        [{ text: "Сдержанный", type: "s" }, { text: "Прямой", type: "d" }, { text: "Строгий", type: "c" }, { text: "Убедительный", type: "i" }],
        [{ text: "Застенчивый", type: "c" }, { text: "Требовательный", type: "d" }, { text: "Терпеливый", type: "s" }, { text: "Очаровательный", type: "i" }],
        [{ text: "Неугомонный", type: "d" }, { text: "Дисциплинированный", type: "c" }, { text: "Вдохновляющий", type: "i" }, { text: "Внимательный", type: "s" }],
        [{ text: "Обязательный", type: "s" }, { text: "Оживленный", type: "i" }, { text: "Решительный", type: "d" }, { text: "Точный", type: "c" }],
        [{ text: "Добросовестный", type: "c" }, { text: "Компанейский", type: "i" }, { text: "Добрый", type: "s" }, { text: "Уверенный в себе", type: "d" }],
        [{ text: "Дипломатичный", type: "c" }, { text: "Отважный", type: "d" }, { text: "Сочувствующий", type: "s" }, { text: "Оптимистичный", type: "i" }],
        [{ text: "Настойчивый", type: "d" }, { text: "Общительный", type: "i" }, { text: "Постоянный", type: "s" }, { text: "Организованный", type: "c" }],
        [{ text: "Соглашающийся", type: "c" }, { text: "Владеющий собой", type: "s" }, { text: "Шутливый", type: "d" }, { text: "Настойчивый", type: "i" }],
        [{ text: "Обаятельный", type: "i" }, { text: "Позитивный", type: "d" }, { text: "Снисходительный", type: "s" }, { text: "Требовательный", type: "c" }],
        [{ text: "Коммуникабельный", type: "i" }, { text: "Смелый", type: "d" }, { text: "Перфекционист", type: "c" }, { text: "Сдержанный", type: "s" }]
    ];

    const typeLabels = { 'd': 'Dominance (Доминирование)', 'i': 'Influence (Влияние)', 's': 'Steadiness (Стабильность)', 'c': 'Compliance (Соответствие)' };
    const typeInfo = {
        'd': 'Вы ориентированы на результат, решительны и склонны к лидерству. Вам важно контролировать ситуацию и достигать целей быстро.',
        'i': 'Вы общительны, оптимистичны и умеете вдохновлять людей. Ваша сила в коммуникации и умении строить отношения.',
        's': 'Вы надежны, терпеливы и отличные слушатели. Вы цените стабильность и гармонию в рабочем коллективе.',
        'c': 'Вы внимательны к деталям, точны и следуете правилам. Ваша сила в аналитике и качестве выполняемой работы.'
    };

    let state = {
        view: 'test',
        currentStep: 0,
        cardOrders: questions.map(q => q.map(item => item.type))
    };

    const app = document.getElementById('app');

    function render() {
        if (state.view === 'test') renderTest();
        else renderResults();
    }

    function renderTest() {
        const step = state.currentStep;
        const startIdx = step * 3;
        const progress = ((step + 1) / 8) * 100;

        let html = `
            <div class="quiz-container">
                <div class="quiz-header">
                    <h1>Тестирование DISC</h1>
                    <p>Разместите блоки в порядке от наиболее похожего на вас до наименее похожего</p>
                </div>
                <div class="tabs">
                    ${Array.from({length: 8}).map((_, i) => `
                        <button class="tab ${i === step ? 'active' : ''}" onclick="changeStep(${i})">
                            ${['Первый', 'Второй', 'Третий', 'Четвертый', 'Пятый', 'Шестой', 'Седьмой', 'Восьмой'][i]}
                        </button>
                    `).join('')}
                </div>
                <div class="quiz-grid">
        `;

        for (let i = 0; i < 3; i++) {
            const cardIdx = startIdx + i;
            const currentOrder = state.cardOrders[cardIdx];
            const cardData = questions[cardIdx];

            html += `
                <div class="card" data-card-idx="${cardIdx}">
                    <div class="card__title">Я наиболее</div>
                    <ul class="list" data-card-idx="${cardIdx}">
                        ${currentOrder.map(type => {
                            const item = cardData.find(it => it.type === type);
                            return `<li class="item" draggable="true" data-type="${type}">${item.text}</li>`;
                        }).join('')}
                    </ul>
                    <div class="card__foot">Я наименее</div>
                </div>
            `;
        }

        html += `
                </div>
                <div class="quiz-footer">
                    <button class="btn btn--ghost" ${step === 0 ? 'disabled' : ''} onclick="changeStep(${step - 1})">Назад</button>
                    <div class="progress-container"><div class="progress-bar" style="width: ${progress}%"></div></div>
                    ${step === 7 
                        ? `<button class="btn btn--primary" onclick="finishTest()">Завершить тест</button>`
                        : `<button class="btn btn--primary" onclick="changeStep(${step + 1})">Далее</button>`
                    }
                </div>
            </div>
        `;

        app.innerHTML = html;
        attachDragAndDrop();
    }

    function renderResults() {
        const scores = calculateScores();
        // Normalize scores for display? 
        // Max possible is 24, min is -24. Let's map -24..24 to 0..100.
        // Actually, let's just show the raw relative values or just 0-100 based on a simple shift.
        const normalize = (val) => Math.max(0, Math.min(100, (val + 24) * (100 / 48)));

        let html = `
            <div class="results-container">
                <h2>Ваш результат</h2>
                <div class="results">
        `;

        ['d', 'i', 's', 'c'].forEach(type => {
            const val = scores[type];
            const percent = normalize(val);
            html += `
                <div class="score-row">
                    <div class="score-info">
                        <span>${typeLabels[type]}</span>
                        <span>${val}</span>
                    </div>
                    <div class="score-bar-bg">
                        <div class="score-bar-fill" style="width: ${percent}%"></div>
                    </div>
                </div>
            `;
        });

        html += `
                </div>
                <div class="desc-box">
                    <h3>Расшифровка:</h3>
                    ${Object.entries(typeInfo).map(([type, info]) => `
                        <p><strong>${typeLabels[type].split(' ')[0]}:</strong> ${info}</p>
                    `).join('')}
                </div>
                <button class="btn btn--primary" style="margin-top: 30px" onclick="restart()">Пройти еще раз</button>
            </div>
        `;

        app.innerHTML = html;
        // Trigger animation for bars
        setTimeout(() => {
            document.querySelectorAll('.score-bar-fill').forEach(bar => {
                // We need to know the intended width. 
                // Since we didn't set it in the HTML template above (we set width: ${percent}%), 
                // it will transition from 0 if we use CSS transition.
            });
        }, 100);
    }

    function calculateScores() {
        const payload = [];
        state.cardOrders.forEach((order, cardIdx) => {
            order.forEach((type, pos) => {
                payload.push({ type, pos });
            });
        });

        const counts = { d: 0, i: 0, s: 0, c: 0 };
        payload.forEach(p => {
            if (p.pos === 0) counts[p.type]++;
            if (p.pos === 3) counts[p.type]--;
        });
        return counts;
    }

    function changeStep(newStep) {
        state.currentStep = newStep;
        render();
    }

    function finishTest() {
        state.view = 'results';
        render();
    }

    function restart() {
        state.view = 'test';
        state.currentStep = 0;
        state.cardOrders = questions.map(q => q.map(item => item.type));
        render();
    }

    function attachDragAndDrop() {
        const lists = document.querySelectorAll('.list');
        let draggedItem = null;

        lists.forEach(list => {
            list.addEventListener('dragstart', (e) => {
                draggedItem = e.target;
                e.target.classList.add('dragging');
                e.dataTransfer.effectAllowed = 'move';
            });

            list.addEventListener('dragend', (e) => {
                e.target.classList.remove('dragging');
                document.querySelectorAll('.item').forEach(el => el.classList.remove('over'));
                saveCurrentOrder();
            });

            list.addEventListener('dragover', (e) => {
                e.preventDefault();
                const overItem = e.target.closest('.item');
                if (overItem && overItem !== draggedItem) {
                    overItem.classList.add('over');
                }
            });

            list.addEventListener('dragleave', (e) => {
                const overItem = e.target.closest('.item');
                if (overItem) overItem.classList.remove('over');
            });

            list.addEventListener('drop', (e) => {
                e.preventDefault();
                const overItem = e.target.closest('.item');
                if (overItem && draggedItem && overItem !== draggedItem) {
                    const list = overItem.parentNode;
                    const rect = overItem.getBoundingClientRect();
                    const midpoint = rect.top + rect.height / 2;
                    
                    if (e.clientY < midpoint) {
                        list.insertBefore(draggedItem, overItem);
                    } else {
                        list.insertBefore(draggedItem, overItem.nextSibling);
                    }
                }
                document.querySelectorAll('.item').forEach(el => el.classList.remove('over'));
                saveCurrentOrder();
            });
        });
    }

    function saveCurrentOrder() {
        const lists = document.querySelectorAll('.list');
        lists.forEach((list, idx) => {
            const items = Array.from(list.querySelectorAll('.item'));
            state.cardOrders[idx] = items.map(item => item.dataset.type);
        });
    }

    render();
</script>
</body>
</html>
