<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DISC Тест</title>
    <style>
        :root {
            --primary: #268AC5;
            --bg: #f4f7f9;
            --text: #333;
            --card-bg: #fff;
            --border: #ddd;
            --shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #app {
            width: 100%;
            max-width: 900px;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: var(--shadow);
            padding: 30px;
            text-align: center;
        }

        h1 {
            color: var(--primary);
            margin-bottom: 10px;
        }

        .lead {
            margin-bottom: 30px;
            color: #666;
            line-height: 1.5;
        }

        .steps-nav {
            display: flex;
            justify-content: center;
            gap: 5px;
            margin-bottom: 20px;
            overflow-x: auto;
            padding-bottom: 10px;
        }

        .step-dot {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 2px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: default;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s;
            flex-shrink: 0;
        }

        .step-dot.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .step-dot.completed {
            border-color: var(--primary);
            color: var(--primary);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            background: #fafafa;
        }

        .card-title {
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 0.9em;
            color: #888;
        }

        .card-foot {
            font-weight: bold;
            margin-top: 10px;
            font-size: 0.9em;
            color: #888;
        }

        .list {
            list-style: none;
            padding: 0;
            margin: 0;
            user-select: none;
        }

        .item {
            background: white;
            border: 1px solid var(--border);
            margin: 5px 0;
            padding: 12px;
            border-radius: 6px;
            cursor: grab;
            transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 500;
        }

        .item:active {
            cursor: grabbing;
        }

        .item.dragging {
            opacity: 0.5;
            background: #eef;
            transform: scale(0.98);
        }

        .item-handle {
            color: #ccc;
            font-size: 12px;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 30px;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: opacity 0.2s;
        }

        .btn-ghost {
            background: transparent;
            color: #888;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .results {
            display: none;
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin: 30px 0;
        }

        .result-item {
            background: #fff;
            border: 2px solid var(--primary);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
        }

        .result-label {
            font-size: 1.2em;
            font-weight: bold;
            display: block;
            margin-bottom: 10px;
        }

        .result-value {
            font-size: 2.5em;
            font-weight: 800;
            color: var(--primary);
        }

        @media (max-width: 600px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<div id="app">
    <div class="container">
        <div id="test-view">
            <h1>Тестирование DISC</h1>
            <p class="lead">Разместите блоки в порядке от наиболее похожего на вас до наименее похожего.</p>
            
            <div class="steps-nav" id="stepsNav"></div>
            
            <div class="grid" id="grid"></div>
            
            <div class="controls">
                <button class="btn btn-ghost" id="prevBtn">Назад</button>
                <button class="btn btn-primary" id="nextBtn">Далее</button>
            </div>
        </div>

        <div id="results-view" class="results">
            <h1>Ваши результаты</h1>
            <p class="lead">Баллы по четырем типам личности:</p>
            <div class="results-grid" id="resultsGrid"></div>
            <button class="btn btn-primary" onclick="location.reload()">Пройти заново</button>
        </div>
    </div>
</div>

<script>
    const questions = [
        [
            { text: "Экспресcивный", type: "i" }, { text: "Покладистый", type: "c" }, { text: "Волевой", type: "d" }, { text: "Осторожный", type: "s" },
            { text: "Пылкий", type: "d" }, { text: "Разговорчивый", type: "i" }, { text: "Добродушный", type: "s" }, { text: "Сдержанный", type: "c" },
            { text: "Любитель приключений", type: "i" }, { text: "Энтузиаст", type: "c" }, { text: "Исполнитель инструкций", type: "d" }, { text: "Верный", type: "s" }
        ],
        [
            { text: "Настойчивый", type: "d" }, { text: "Осторожный", type: "c" }, { text: "Эмоциональный", type: "i" }, { text: "Удовлетворенный", type: "s" },
            { text: "Довольный", type: "s" }, { text: "Нетерпеливый", type: "d" }, { text: "Убедительный", type: "i" }, { text: "Безропотный", type: "c" },
            { text: "Смиренный", type: "c" }, { text: "Умеющий слушать", type: "s" }, { text: "Душа компании", type: "i" }, { text: "Волевой", type: "d" }
        ],
        [
            { text: "Правильный", type: "c" }, { text: "Первопроходец", type: "d" }, { text: "Спокойный", type: "s" }, { text: "Влиятельный", type: "i" },
            { text: "Почтительный", type: "c" }, { text: "Контактный", type: "i" }, { text: "Агрессивный", type: "d" }, { text: "Мягкий", type: "s" },
            { text: "Весельчак", type: "i" }, { text: "Покорный", type: "s" }, { text: "Тактичный", type: "c" }, { text: "Соперничающий", type: "d" }
        ],
        [
            { text: "Точный", type: "c" }, { text: "Доминирующий", type: "d" }, { text: "Охотный", type: "s" }, { text: "Притягательный", type: "i" },
            { text: "Уравновешенный", type: "i" }, { text: "Уступчивый", type: "c" }, { text: "Идущий на риск", type: "d" }, { text: "Услужливый", type: "s" },
            { text: "Осмотрительный", type: "c" }, { text: "Добрососедский", type: "s" }, { text: "Энергичный", type: "d" }, { text: "Убедительный", type: "i" }
        ],
        [
            { text: "Уравновешенный", type: "s" }, { text: "Мотивирующий", type: "i" }, { text: "Щепетильный", type: "c" }, { text: "Решительный", type: "d" },
            { text: "Уверенный", type: "i" }, { text: "Готовый к сотрудничеству", type: "c" }, { text: "Беззаботный", type: "s" }, { text: "Аргументирующий", type: "d" },
            { text: "Сдержанный", type: "s" }, { text: "Прямой", type: "d" }, { text: "Строгий", type: "c" }, { text: "Убедительный", type: "i" }
        ],
        [
            { text: "Застенчивый", type: "c" }, { text: "Требовательный", type: "d" }, { text: "Терпеливый", type: "s" }, { text: "Очаровательный", type: "i" },
            { text: "Неугомонный", type: "d" }, { text: "Дисциплинированный", type: "c" }, { text: "Вдохновляющий", type: "i" }, { text: "Внимательный", type: "s" },
            { text: "Обязательный", type: "s" }, { text: "Оживленный", type: "i" }, { text: "Решительный", type: "d" }, { text: "Точный", type: "c" }
        ],
        [
            { text: "Добросовестный", type: "c" }, { text: "Компанейский", type: "i" }, { text: "Добрый", type: "s" }, { text: "Уверенный в себе", type: "d" },
            { text: "Дипломатичный", type: "c" }, { text: "Отважный", type: "d" }, { text: "Сочувствующий", type: "s" }, { text: "Оптимистичный", type: "i" },
            { text: "Настойчивый", type: "d" }, { text: "Общительный", type: "i" }, { text: "Постоянный", type: "s" }, { text: "Организованный", type: "c" }
        ],
        [
            { text: "Соглашающийся", type: "c" }, { text: "Владеющий собой", type: "s" }, { text: "Шутливый", type: "d" }, { text: "Настойчивый", type: "i" },
            { text: "Обаятельный", type: "i" }, { text: "Позитивный", type: "d" }, { text: "Снисходительный", type: "s" }, { text: "Требовательный", type: "c" },
            { text: "Коммуникабельный", type: "i" }, { text: "Смелый", type: "d" }, { text: "Перфекционист", type: "c" }, { text: "Сдержанный", type: "s" }
        ]
    ];

    let currentStep = 0;

    function init() {
        renderStepsNav();
        renderStep();
        
        document.getElementById('prevBtn').addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                renderStep();
            }
        });

        document.getElementById('nextBtn').addEventListener('click', () => {
            if (currentStep < questions.length - 1) {
                currentStep++;
                renderStep();
            } else {
                finishTest();
            }
        });
    }

    function renderStepsNav() {
        const nav = document.getElementById('stepsNav');
        for (let i = 0; i < questions.length; i++) {
            const dot = document.createElement('div');
            dot.className = 'step-dot';
            dot.textContent = i + 1;
            dot.id = `dot-${i}`;
            nav.appendChild(dot);
        }
    }

    function updateNav() {
        for (let i = 0; i < questions.length; i++) {
            const dot = document.getElementById(`dot-${i}`);
            dot.className = 'step-dot' + 
                (i === currentStep ? ' active' : (i < currentStep ? ' completed' : ''));
        }
    }

    function renderStep() {
        updateNav();
        const grid = document.getElementById('grid');
        grid.innerHTML = '';
        
        const stepData = questions[currentStep];
        
        for (let i = 0; i < 3; i++) {
            const listItems = stepData.slice(i * 4, (i * 4) + 4);
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="card-title">Я наиболее</div>
                <ul class="list" data-list-idx="${i}"></ul>
                <div class="card-foot">Я наименее</div>
            `;
            const list = card.querySelector('.list');
            listItems.forEach((item, idx) => {
                const li = document.createElement('li');
                li.className = 'item';
                li.draggable = true;
                li.dataset.type = item.type;
                li.innerHTML = `<span class="item-handle">☰</span> ${item.text}`;
                li.addEventListener('dragstart', () => li.classList.add('dragging'));
                li.addEventListener('dragend', () => li.classList.remove('dragging'));
                list.appendChild(li);
            });
            list.addEventListener('dragover', e => {
                e.preventDefault();
                const dragging = document.querySelector('.dragging');
                const afterElement = getDragAfterElement(list, e.clientY);
                if (afterElement == null) {
                    list.appendChild(dragging);
                } else {
                    list.insertBefore(dragging, afterElement);
                }
            });
            grid.appendChild(card);
        }
        
        const nextBtn = document.getElementById('nextBtn');
        nextBtn.textContent = currentStep === questions.length - 1 ? 'Завершить' : 'Далее';
        document.getElementById('prevBtn').disabled = currentStep === 0;
    }

    function getDragAfterElement(container, y) {
        const draggableElements = [...container.querySelectorAll('.item:not(.dragging)')];
        return draggableElements.reduce((closest, child) => {
            const box = child.getBoundingClientRect();
            const offset = y - box.top - box.height / 2;
            if (offset < 0 && offset > closest.offset) {
                return { offset: offset, element: child };
            } else {
                return closest;
            }
        }, { offset: Number.NEGATIVE_INFINITY }).element;
    }

    function finishTest() {
        const allLists = document.querySelectorAll('.list');
        const payload = [];
        allLists.forEach((list) => {
            const items = [...list.querySelectorAll('.item')];
            items.forEach((item, pos) => {
                payload.push({ pos, type: item.dataset.type });
            });
        });
        showResults(calculateScore(payload));
    }

    function calculateScore(payload) {
        const maj = [];
        const min = [];
        for (let i = 0; i < payload.length; i += 4) {
            maj.push(payload[i].type);
            min.push(payload[i+3].type);
        }
        const count = (arr, ch) => arr.reduce((a, v) => a + (v === ch ? 1 : 0), 0);
        return {
            d: count(maj, 'd') - count(min, 'd'),
            i: count(maj, 'i') - count(min, 'i'),
            s: count(maj, 's') - count(min, 's'),
            c: count(maj, 'c') - count(min, 'c')
        };
    }

    function showResults(scores) {
        document.getElementById('test-view').style.display = 'none';
        document.getElementById('results-view').style.display = 'block';
        const grid = document.getElementById('resultsGrid');
        grid.innerHTML = '';
        const labels = { d: 'Доминирование (D)', i: 'Влияние (I)', s: 'Стабильность (S)', c: 'Соответствие (C)' };
        Object.entries(scores).forEach(([type, value]) => {
            const item = document.createElement('div');
            item.className = 'result-item';
            item.innerHTML = `<span class="result-label">${labels[type]}</span><span class="result-value">${value}</span>`;
            grid.appendChild(item);
        });
    }

    init();
</script>
</body>
</html>
