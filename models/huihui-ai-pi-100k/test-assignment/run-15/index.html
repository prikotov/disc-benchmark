<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Тест DISC — типы поведения</title>
<style>
  :root{
    --ink:#0f1b2d;
    --ink-2:#41506b;
    --line:#dde4ee;
    --bg:#f3f6fb;
    --card:#ffffff;
    --brand:#2f5fd0;
    --brand-2:#1d49ad;
    --brand-soft:#e8eefc;
    --ok:#1f9d55;
    --radius:14px;
    --shadow:0 8px 28px rgba(15,27,45,.08);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1100px 500px at 85% -10%, #e3ecff 0%, rgba(227,236,255,0) 60%),
      var(--bg);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1080px;margin:0 auto;padding:28px 18px 64px}

  /* ---------- header ---------- */
  header.app{display:flex;align-items:center;gap:12px;margin-bottom:26px}
  .logo{width:40px;height:40px;flex:0 0 auto}
  header.app .h1{font-size:20px;font-weight:700;letter-spacing:.2px}
  header.app .sub{font-size:13px;color:var(--ink-2);margin-top:2px}

  /* ---------- panels ---------- */
  .panel{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
  }
  .hidden{display:none !important}

  /* ---------- start ---------- */
  .start{
    padding:56px 32px;text-align:center;
    display:flex;flex-direction:column;align-items:center;gap:18px;
  }
  .start-badge{
    display:inline-flex;align-items:center;gap:8px;
    background:var(--brand-soft);color:var(--brand-2);
    font-size:13px;font-weight:600;
    padding:7px 14px;border-radius:999px;
  }
  .start h1{margin:0;font-size:34px;line-height:1.15;letter-spacing:-.3px}
  .start p{margin:0;max-width:560px;color:var(--ink-2);font-size:16px;line-height:1.6}
  .chips{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:4px}
  .chip{
    font-size:14px;font-weight:700;
    width:52px;height:52px;border-radius:12px;
    display:flex;align-items:center;justify-content:center;
    color:#fff;
  }

  /* ---------- buttons ---------- */
  .btn{
    appearance:none;border:0;cursor:pointer;
    font:inherit;font-size:15px;font-weight:600;
    border-radius:11px;padding:12px 22px;
    display:inline-flex;align-items:center;gap:10px;
    transition:background .15s ease, transform .05s ease;
  }
  .btn:active{transform:translateY(1px)}
  .btn.primary{background:var(--brand);color:#fff}
  .btn.primary:hover{background:var(--brand-2)}
  .btn.ghost{background:transparent;color:var(--ink-2);border:1px solid var(--line)}
  .btn.ghost:hover{background:#eef2f9;color:var(--ink)}
  .btn.big{font-size:17px;padding:15px 34px;border-radius:13px}
  .btn:disabled{opacity:.45;cursor:default}
  .btn:disabled:hover{background:var(--brand)}
  .btn.ghost:disabled:hover{background:transparent;color:var(--ink-2)}
  .btn .ic{display:block}

  /* ---------- wizard ---------- */
  .wizard{padding:26px 26px 30px}
  .wiz-head{display:flex;align-items:baseline;justify-content:space-between;gap:14px;flex-wrap:wrap}
  .wiz-head h2{margin:0;font-size:22px}
  .wiz-head .note{font-size:13.5px;color:var(--ink-2)}

  .progress{height:6px;background:#e6ebf4;border-radius:999px;overflow:hidden;margin:16px 0 18px}
  .progress .bar{height:100%;width:12.5%;background:linear-gradient(90deg,#4d79e6,#2f5fd0);border-radius:999px;transition:width .25s ease}

  .tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
  .tab{
    appearance:none;border:1px solid var(--line);background:#fff;color:var(--ink-2);
    font:inherit;font-size:13.5px;font-weight:600;
    border-radius:999px;padding:8px 14px;cursor:pointer;white-space:nowrap;
    flex:0 0 auto;
  }
  .tab:hover{border-color:#b9c6de;color:var(--ink)}
  .tab.is-done{color:var(--ok);border-color:#bfe3cd;background:#f0faf4}
  .tab.is-active{background:var(--brand);border-color:var(--brand);color:#fff}

  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:20px}
  @media (max-width:860px){.cards{grid-template-columns:1fr}}

  .q{
    border:1px solid var(--line);border-radius:12px;background:#fbfcfe;
    padding:14px 14px 10px;display:flex;flex-direction:column;gap:10px;
  }
  .q .pole{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--ink-2);font-weight:600}
  .q .pole .ic{color:var(--brand);margin-right:6px;display:inline-flex;vertical-align:-2px}
  .q .pole .down{color:#a06b12;margin-left:6px;display:inline-flex;vertical-align:-2px}

  ul.dlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
  .ditem{
    display:flex;align-items:center;gap:9px;
    background:#fff;border:1px solid var(--line);border-radius:10px;
    padding:9px 10px;user-select:none;touch-action:none;cursor:grab;
    font-size:14.5px;line-height:1.3;
  }
  .ditem .grip{flex:0 0 auto;color:#aab4c6;display:flex}
  .ditem .txt{flex:1}
  .ditem.is-over{border-color:var(--brand);box-shadow:0 0 0 2px rgba(47,95,208,.18)}
  .ditem.is-dragging{opacity:.45;cursor:grabbing}
  .ditem.is-top {border-left:4px solid var(--ok)}
  .ditem.is-bottom{border-left:4px solid #d98f3c}

  .wiz-nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:24px}
  .wiz-nav .spacer{flex:1}
  .step-label{font-size:13.5px;color:var(--ink-2)}

  /* ---------- result ---------- */
  .result{padding:52px 32px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:16px}
  .result .badge{width:56px;height:56px;color:var(--ok)}
  .result h2{margin:0;font-size:28px}
  .result .scores{
    display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:10px 0 4px;
  }
  .score-box{
    min-width:118px;padding:16px 12px 14px;
    border:1px solid var(--line);border-radius:12px;background:#fbfcfe;
  }
  .score-box .k{font-size:14px;font-weight:700;letter-spacing:.4px}
  .score-box .v{font-size:34px;font-weight:800;margin-top:4px;letter-spacing:-1px}
  .score-box .d{font-size:12.5px;color:var(--ink-2);margin-top:8px;line-height:1.45}
  .result .oneline{font-size:16px;font-weight:700;color:var(--ink)}
  .result .hint{font-size:13.5px;color:var(--ink-2);max-width:520px;line-height:1.55;margin:0}
  .result .actions{display:flex;gap:12px;margin-top:14px;flex-wrap:wrap;justify-content:center}
</style>
</head>
<body>
<div class="wrap">

  <header class="app">
    <svg class="logo" viewBox="0 0 48 48" fill="none" aria-hidden="true">
      <rect width="48" height="48" rx="12" fill="#2F5FD0"/>
      <path d="M13 30.5 L18.5 20 L24.5 27 L31 15 L35 30.5" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="13" cy="30.5" r="2.6" fill="#FFD84D"/>
      <circle cx="35" cy="30.5" r="2.6" fill="#FFD84D"/>
    </svg>
    <div>
      <div class="h1">Школа менеджмента Stratoplan</div>
      <div class="sub">Тестирование DISC — четыре типа поведения</div>
    </div>
  </header>
  <div id="app"></div>
</div>

<script>
"use strict";
/* ============================================================
   Данные теста (8 шагов × 3 вопроса, 4 варианта в каждом).
   Каждый вариант несёт служебный тип: d / i / s / c.
   ============================================================ */
const QUESTIONS = [[{"title":"Я наиболее","foot":"Я наименее","items":[["Экспресcивный","i"],["Покладистый","c"],["Волевой","d"],["Осторожный","s"]]},{"title":"Я наиболее","foot":"Я наименее","items":[["Пылкий","d"],["Разговорчивый","i"],["Добродушный","s"],["Сдержанный","c"]]},{"title":"Я наиболее","foot":"Я наименее","items":[["Любитель приключений","i"],["Энтузиаст","c"],["Исполнитель инструкций","d"],["Верный","s"]]}],[{"title":"Я наиболее","foot":"Я наименее","items":[["Настойчивый","d"],["Осторожный","c"],["Эмоциональный","i"],["Удовлетворенный","s"]]},{"title":"Я наиболее","foot":"Я наименее","items":[["Довольный","s"],["Нетерпеливый","d"],["Убедительный","i"],["Безропотный","c"]]},{"title":"Я наиболее","foot":"Я наименее","items":[["Смиренный","c"],["Умеющий слушать","s"],["Душа компании","i"],["Волевой","d"]]}],[{"title":"Я наиболее","foot":"Я наименее","items":[["Правильный","c"],["Первопроходец","d"],["Спокойный","s"],["Влиятельный","i"]]},{"title":"Я наиболее","foot":"Я наименее","items":[["Почтительный","c"],["Контактный","i"],["Агрессивный","d"],["Мягкий","s"]]},{"title":"Я наиболее","foot":"Я наименее","items":[["Весельчак","i"],["Покорный","s"],["Тактичный","c"],["Соперничающий","d"]]}],[{"title":"Я наиболее","foot":"Я наименее","items":[["Точный","c"],["Доминирующий","d"],["Охотный","s"],["Притягательный","i"]]},{"title":"Я наиболее","foot":"Я наименее","items":[["Уравновешенный","i"],["Уступчивый","c"],["Идущий на риск","d"],["Услужливый","s"]]},{"title":"Я наиболее","foot":"Я наименее","items":[["Осмотрительный","c"],["Добрососедский","s"],["Энергичный","d"],["Убедительный","i"]]}],[{"title":"Я наиболее","foot":"Я наименее","items":[["Уравновешенный","s"],["Мотивирующий","i"],["Щепетильный","c"],["Решительный","d"]]},{"title":"Я наиболее","foot":"Я наименее","items":[["Уверенный","i"],["Готовый к сотрудничеству","c"],["Беззаботный","s"],["Аргументирующий","d"]]},{"title":"Я наиболее","foot":"Я наименее","items":[["Сдержанный","s"],["Прямой","d"],["Строгий","c"],["Убедительный","i"]]}],[{"title":"Я наиболее","foot":"Я наименее","items":[["Застенчивый","c"],["Требовательный","d"],["Терпеливый","s"],["Очаровательный","i"]]},{"title":"Я наиболее","foot":"Я наименее","items":[["Неугомонный","d"],["Дисциплинированный","c"],["Вдохновляющий","i"],["Внимательный","s"]]},{"title":"Я наиболее","foot":"Я наименее","items":[["Обязательный","s"],["Оживленный","i"],["Решительный","d"],["Точный","c"]]}],[{"title":"Я наиболее","foot":"Я наименее","items":[["Добросовестный","c"],["Компанейский","i"],["Добрый","s"],["Уверенный в себе","d"]]},{"title":"Я наиболее","foot":"Я наименее","items":[["Дипломатичный","c"],["Отважный","d"],["Сочувствующий","s"],["Оптимистичный","i"]]},{"title":"Я наиболее","foot":"Я наименее","items":[["Настойчивый","d"],["Общительный","i"],["Постоянный","s"],["Организованный","c"]]}],[{"title":"Я наиболее","foot":"Я наименее","items":[["Соглашающийся","c"],["Владеющий собой","s"],["Шутливый","d"],["Настойчивый","i"]]},{"title":"Я наиболее","foot":"Я наименее","items":[["Обаятельный","i"],["Позитивный","d"],["Снисходительный","s"],["Требовательный","c"]]},{"title":"Я наиболее","foot":"Я наименее","items":[["Коммуникабельный","i"],["Смелый","d"],["Перфекционист","c"],["Сдержанный","s"]]}]];

const STEP_NAMES = ["Первый","Второй","Третий","Четвертый","Пятый","Шестой","Седьмой","Восьмой"];

/* ---------- иконки (инлайн SVG) ---------- */
const IC = {
  grip: '<svg width="14" height="18" viewBox="0 0 14 18" fill="currentColor" aria-hidden="true"><circle cx="3.5" cy="2.5" r="1.8"/><circle cx="10.5" cy="2.5" r="1.8"/><circle cx="3.5" cy="9" r="1.8"/><circle cx="10.5" cy="9" r="1.8"/><circle cx="3.5" cy="15.5" r="1.8"/><circle cx="10.5" cy="15.5" r="1.8"/></svg>',
  up:   '<svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M10.5 7.5 L7 3.5 L3.5 7.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  down: '<svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M3.5 5.5 L7 9.5 L10.5 5.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  left: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M10 3.5 L5.5 8 L10 12.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  right:'<svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6 3.5 L10.5 8 L6 12.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  check:'<svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 8.5 L6.5 12 L13 4.5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  bigcheck:'<svg class="badge" viewBox="0 0 56 56" fill="none" aria-hidden="true"><circle cx="28" cy="28" r="26" stroke="currentColor" stroke-width="3.5" opacity=".25"/><circle cx="28" cy="28" r="26" fill="rgba(31,157,85,.12)"/><path d="M17 29 L25 37 L40 20" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  refresh:'<svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M13.2 8a5.2 5.2 0 1 1-1.5-3.7M13.2 2.4 v3.2 h-3.2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  bolt:'<svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8.8 1.5 L3.5 9.2 H7.2 L6.4 14.5 L11.9 6.4 H8.1 L8.8 1.5 Z" fill="currentColor"/></svg>'
};

const TYPE_INFO = {
  d:{label:"D — Доминирующий", desc:"Действие, решение, результат"},
  i:{label:"I — Влиятельный",  desc:"Людям, общение, энтузиазм"},
  s:{label:"S — Стабильный",   desc:"Договорённости, надёжность"},
  c:{label:"C — Соблюдающий",  desc:"Правила, порядок, качество"}
};

/* ============================================================
   Статус: порядок вариантов в каждом списке сохраняется
   в state.order[step][card] = массив из 4 индексов вариантов.
   ============================================================ */
const state = {
  view:"start",        // start | test | result
  step:0,
  order:QUESTIONS.map(cards => cards.map(() => [0,1,2,3])),
  score:null
};

/* ============================================================
   Подсчёт (как в оригинале):
   по каждому из 24 списков — позиция 0 (наиболее похоже)
   даёт +1 типу варианта, позиция 3 (наименее похоже) даёт −1.
   ============================================================ */
function computeScore(){
  const res = {d:0, i:0, s:0, c:0};
  state.order.forEach((cards, si) => cards.forEach((order, ci) => {
    const items = QUESTIONS[si][ci].items;
    const top = items[order[0]][1];
    const bot = items[order[3]][1];
    res[top] += 1;
    res[bot] -= 1;
  }));
  return res;
}

/* ============================================================
   Рендер
   ============================================================ */
const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function render(){
  if(state.view === "start")  app.innerHTML = renderStart();
  else if(state.view === "test") app.innerHTML = renderTest();
  else app.innerHTML = renderResult();
  bind();
}

function renderStart(){
  return `
  <section class="panel start">
    <span class="start-badge">${IC.bolt} Типы личности за 5 минут</span>
    <h1>Тест DISC</h1>
    <p>Помните — чем честнее вы с тестом, тем точнее результаты!
    Разместите блоки в порядке <b>от наиболее похожего на вас до наименее похожего</b>.</p>
    <div class="chips" aria-hidden="true">
      <span class="chip" style="background:#c0392b">D</span>
      <span class="chip" style="background:#8e44ad">I</span>
      <span class="chip" style="background:#1f9d55">S</span>
      <span class="chip" style="background:#2f5fd0">C</span>
    </div>
    <button class="btn primary big" data-act="start">${IC.check} Начать тест</button>
  </section>`;
}

function renderTest(){
  const step = state.step;
  const cardsHtml = QUESTIONS[step].map((c, ci) => `
    <div class="q">
      <div class="pole"><span>${IC.up}${esc(c.title)}</span><span>${esc(c.foot)}${IC.down}</span></div>
      <ul class="dlist" data-card="${ci}">
        ${state.order[step][ci].map((itemIdx, pos) => {
          const it = c.items[itemIdx];
          const cls = pos === 0 ? " is-top" : (pos === 3 ? " is-bottom" : "");
          return `<li class="ditem${cls}" data-item="${itemIdx}" data-pos="${pos}">
            <span class="grip">${IC.grip}</span>
            <span class="txt">${esc(it[0])}</span>
          </li>`;
        }).join("")}
      </ul>
    </div>`).join("");

  const tabsHtml = STEP_NAMES.map((name, i) => {
    const cls = i === step ? " is-active" : (i < step ? " is-done" : "");
    return `<button class="tab${cls}" data-goto="${i}">${i < step ? IC.check + " " : ""}${name}</button>`;
  }).join("");

  const isLast = step === QUESTIONS.length - 1;
  const canPrev = step > 0;
  return `
  <section class="panel wizard">
    <div class="wiz-head">
      <h2>Вопрос ${step + 1} из ${QUESTIONS.length}</h2>
      <span class="note">Перетащите варианты: сверху — наиболее похоже, снизу — наименее похоже</span>
    </div>
    <div class="progress" role="progressbar" aria-valuemin="1" aria-valuemax="${QUESTIONS.length}" aria-valuenow="${step+1}"><div class="bar" style="width:${((step+1)/QUESTIONS.length*100).toFixed(2)}%"></div></div>
    <div class="tabs" role="tablist">${tabsHtml}</div>
    <div class="cards">${cardsHtml}</div>
    <div class="wiz-nav">
      <button class="btn ghost" data-act="prev" ${canPrev ? "" : "disabled"}>${IC.left} Назад</button>
      <span class="spacer"></span>
      <span class="step-label">${STEP_NAMES[step]} шаг</span>
      ${isLast
        ? `<button class="btn primary" data-act="finish">${IC.check} Завершить</button>`
        : `<button class="btn primary" data-act="next">Далее ${IC.right}</button>`}
    </div>
  </section>`;
}

function renderResult(){
  const s = state.score;
  const boxes = ["d","i","s","c"].map(k => {
    const v = s[k];
    return `<div class="score-box">
      <div class="k" style="color:${{"d":"#c0392b","i":"#8e44ad","s":"#1f9d55","c":"#2f5fd0"}[k]}">${TYPE_INFO[k].label.toUpperCase()}</div>
      <div class="v">${v}</div>
      <div class="d">${TYPE_INFO[k].desc}</div>
    </div>`;
  }).join("");
  const line = `D:${s.d}, I:${s.i}, S:${s.s}, C:${s.c}`;
  return `
  <section class="panel result">
    ${IC.bigcheck}
    <h2>Тест завершён</h2>
    <div class="scores">${boxes}</div>
    <div class="oneline">Ваш DISC-профиль: ${line}</div>
    <p class="hint">Балл по каждому типу: +1 за вариант, который вы разместили наивысше,
    −1 за размещённый наинижше (в каждом из ${QUESTIONS.length * 3} списков).
    Обратите внимание: мы не даём расшифровку индивидуальных результатов —
    инструмент помогает вам для самотестирования и работы с командой.</p>
    <div class="actions">
      <button class="btn ghost" data-act="again">${IC.refresh} Пройти ещё раз</button>
      <button class="btn primary" data-act="review">Посмотреть ответы</button>
    </div>
  </section>`;
}

/* ============================================================
   Привязка событий
   ============================================================ */
function bind(){
  app.querySelectorAll("[data-act]").forEach(b => b.addEventListener("click", () => {
    const act = b.dataset.act;
    if(act === "start")    { state.view = "test"; render(); }
    if(act === "again")    { state.order = QUESTIONS.map(cards => cards.map(() => [0,1,2,3])); state.step = 0; state.score = null; state.view = "start"; render(); }
    if(act === "review")   { state.view = "test"; render(); }
    if(act === "prev")     { state.step = Math.max(0, state.step - 1); render(); }
    if(act === "next")     { state.step = Math.min(QUESTIONS.length - 1, state.step + 1); render(); }
    if(act === "finish"){
      state.score = computeScore();
      state.view = "result";
      render();
    }
  }));
  app.querySelectorAll("[data-goto]").forEach(t => t.addEventListener("click", () => {
    state.step = Number(t.dataset.goto); render();
  }));
  initDrag();
}

/* ============================================================
   Drag & drop: pointer events (мышь + тач), перестановка
   внутри одного списка (каждый вопрос — независим).
   ============================================================ */
function initDrag(){
  let drag = null; // {listEl, li, itemIdx, rect}

  app.querySelectorAll(".dlist").forEach(ul => {
    ul.querySelectorAll(".ditem").forEach(li => {
      li.addEventListener("pointerdown", e => {
        if(e.button !== undefined && e.button !== 0) return;
        e.preventDefault();
        drag = { ul, li };
        li.classList.add("is-dragging");
        try{ li.setPointerCapture(e.pointerId); }catch(_){}
      });
      li.addEventListener("pointermove", e => {
        if(!drag || drag.li !== li) return;
        const rect = li.getBoundingClientRect();
        const over = drag.li;
        // находим элемент под курсором в этом списке
        const el = document.elementFromPoint(e.clientX, e.clientY);
        const target = el && el.closest ? el.closest(".ditem") : null;
        if(!target || target === over || !drag.ul.contains(target)) return;
        const tRect = target.getBoundingClientRect();
        const before = (e.clientY - tRect.top) < tRect.height / 2;
        drag.ul.insertBefore(over, before ? target : target.nextSibling);
        target.classList.add("is-over");
        setTimeout(() => target.classList.remove("is-over"), 120);
      });
    });
    const endDrag = e => {
      if(!drag) return;
      drag.li.classList.remove("is-dragging");
      // записываем новый порядок в state
      const liArr = Array.from(drag.ul.querySelectorAll(".ditem"));
      const ci = Number(drag.ul.dataset.card);
      state.order[state.step][ci] = liArr.map(el => Number(el.dataset.item));
      // обновляем подсветку позиций и data-pos
      liArr.forEach((el, pos) => {
        el.dataset.pos = pos;
        el.classList.toggle("is-top", pos === 0);
        el.classList.toggle("is-bottom", pos === 3);
      });
      drag = null;
    };
    ul.querySelectorAll(".ditem").forEach(li => {
      li.addEventListener("pointerup", endDrag);
      li.addEventListener("pointercancel", endDrag);
    });
  });
}

render();
</script>
